name: maira_dev_web
description: "Maira.dev's portfolio website."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <=5.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  go_router: ^16.0.0
  fpdart: ^1.1.1
  font_awesome_flutter: ^10.8.0
